{% extends "base.html" %}
{% block content %}

<div class="form-card">
    <h1>Edit Movie</h1>
    <form method="POST">
        <input type="text" name="title" value="{{ movie.title }}" required>
        <input type="text" name="genre" value="{{ movie.genre }}" required>

        <select name="status" id="statusSelect">
            <option value="watchlist" {% if movie.status == 'watchlist' %}selected{% endif %}>Want to Watch</option>
            <option value="watched" {% if movie.status == 'watched' %}selected{% endif %}>Watched</option>
        </select>

        <input type="number" name="rating" id="ratingInput" value="{{ movie.rating or '' }}" min="1" max="10"
            style="{% if movie.status != 'watched' %}display:none;{% endif %}">

        <textarea name="notes">{{ movie.notes }}</textarea>
        <button type="submit">Save Changes</button>
    </form>
</div>

<script>
const statusSelect = document.getElementById('statusSelect');
const ratingInput = document.getElementById('ratingInput');

function toggleRating() {
    ratingInput.style.display = statusSelect.value === 'watched' ? 'block' : 'none';
}

statusSelect.addEventListener('change', toggleRating);
</script>

{% endblock %}
